# Run:      uvx pre-commit run --all-files
# Install:  uvx pre-commit install
# Update:   uvx pre-commit autoupdate
#
# Excluded globally below:
#   scripts/web/    369 tracked files of committed Vite build output
#   tests/fixtures/ byte-exact scene fixtures — whitespace fixes break tests
#   package-lock.json, uv.lock, skills-lock.json — generated

exclude: |
  (?x)^(
    skills/wysiwyg-grilling/scripts/web/.*
    |tests/fixtures/.*
    |frontends/wysiwyg-grilling/package-lock\.json
    |uv\.lock
    |skills-lock\.json
  )$

repos:
  # ---------------------------------------------------------------- hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-ast
      - id: debug-statements

  # ------------------------------------------------- python lint + docstrings
  # Covers E/F/W/I/B/SIM/N + D (Google docstrings) + ANN (type hints)
  # + DOC (Args/Returns completeness). Configured in pyproject.toml.
  # No `ruff format`: see AGENTS.md § Formatting.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]

  # ------------------------------------------------------ python type checking
  # `ty` replaced mypy AND pyright on 2026-08-25 — one checker, same vendor as
  # ruff and uv. Scope, the five ignored rules, and the reason for each are in
  # pyproject.toml `[tool.ty]`; ty reads that file, so this hook passes no
  # flags and cannot disagree with it.
  #
  # THIS IS WHERE THE VERSION IS PINNED. ty is 0.0.x and its defaults move
  # between releases, so `ty@0.0.21` is written out the way the ruff hook above
  # carries `rev: v0.16.2`. To move it: bump the string, run the hook, triage
  # whatever is new, then commit. `uvx pre-commit autoupdate` does NOT touch
  # this line — it only walks `rev:` on remote repos, and this is a local hook.
  #
  # AUTOMATIC, AND NOT A LIKE-FOR-LIKE REPLACEMENT OF THE mypy HOOK IT TOOK
  # OVER FROM — it checks more. mypy skips the bodies of untyped functions, and
  # canvas.py carries the `ANN` debt, so `uvx mypy` printed "Success: no issues
  # found" while `--check-untyped-defs` printed 109 errors. ty has no such
  # mode: the same error injected into an unannotated def is reported, where
  # mypy was silent. So the hook count did not change but the checked surface
  # grew, and it grew before any of that annotation debt was paid.
  #
  # `always_run`, not a `files:` pattern. A pattern would have to name
  # canvas.py and tests/, and this hook's real input is `[tool.ty]` in
  # pyproject.toml as well — a scope or rule edit with no .py staged has to
  # re-check, and it is 1.2s for the whole 17-file surface.
  #
  # IT IS GREEN, AND THE WAY TO KEEP IT GREEN IS NOT `[tool.ty.rules]`. Every
  # finding that stood between this hook and the automatic stage was paid by
  # annotating, renaming or repairing; the four that could not be were
  # suppressed one line at a time with the derivation written beside them.
  # Widening the ignore list retires the finding instead of the debt.
  - repo: local
    hooks:
      - id: ty
        name: ty (canvas.py + tests)
        entry: uvx ty@0.0.21 check
        language: system
        pass_filenames: false
        require_serial: true
        always_run: true

  # -------------------------------------------------------------- live values
  # The `<!-- live:NAME -->` values in tracked markdown, recomputed from
  # their sources. Deliberately unscoped by `files:`: a value derives from
  # code, not from the document holding it, so any pattern narrow enough to
  # be worth writing would itself go stale — which is the defect this hook
  # exists for. It costs ~0.5s and reads only what `git ls-files` lists, so
  # the gitignored docs/ tree is out of reach by construction.
  # When it fails: `python3 tests/livedoc.py refresh`.
  - repo: local
    hooks:
      - id: livedoc
        name: livedoc check (live values in tracked prose)
        entry: python3 tests/livedoc.py check
        language: system
        pass_filenames: false
        require_serial: true

  # ------------------------------------------------------------------- tests
  - repo: local
    hooks:
      - id: backend-tests
        name: backend tests
        entry: python3 -m unittest discover -s tests -q
        language: system
        pass_filenames: false
        require_serial: true
        files: ^(skills/wysiwyg-grilling/scripts/canvas\.py|tests/.*\.py)$

  # ------------------------------------------------------- the guard census
  # `tests/guard_mutants.py` deletes each backend pin guard and the shipped
  # frontend font-readiness barrier, then demands the named test go red. It
  # is the repo's answer to "is this
  # guard observed" — and until now nothing ran it, so it could be broken
  # indefinitely and say nothing. An instrument that cannot report its own
  # death is not an instrument.
  #
  # SPLIT, because the two halves have wildly different costs. `--check`
  # starts no process and writes nothing: it asks whether each mutation
  # still APPLIES and whether each named test still RESOLVES, which is
  # every way this file loses its subject short of a guard genuinely going
  # unobserved. Measured at 0.50s, so it is `always_run` rather than
  # carrying a `files:` pattern — a pattern that stops matching is the same
  # silent-instrument defect one level up, and half a second does not buy
  # one.
  #
  # The SWEEP stays manual. It costs about 2 minutes (23 backend mutants plus
  # one browser mutant and its pristine control) and, decisively, it REWRITES
  # guarded runtime files in place and restores them in a `finally` — a
  # pre-commit run interrupted at the wrong moment would
  # leave a mutation in the working tree. That risk is fine in a
  # curator's hands and wrong on every commit. Run it whenever a guard is
  # added, moved or re-worded:
  #     uvx pre-commit run guard-mutants-sweep --hook-stage manual
  - repo: local
    hooks:
      - id: guard-mutants-check
        name: guard census subjects (anchors + named tests resolve)
        entry: python3 tests/guard_mutants.py --check
        language: system
        pass_filenames: false
        require_serial: true
        always_run: true

      # `always_run` ALONGSIDE `stages: [manual]`, and the two are not in
      # tension: `stages` decides WHEN this hook is eligible, `always_run`
      # decides whether it needs a changed file to bother. Without it,
      # `pre-commit run guard-mutants-sweep --hook-stage manual` on a clean
      # tree prints "(no files to check)Skipped" and exits 0 — a sweep
      # somebody deliberately asked for, reporting success for not having
      # run. Caught here by running the documented command.
      - id: guard-mutants-sweep
        name: guard census full sweep (manual, rewrites guarded runtime)
        entry: python3 tests/guard_mutants.py
        language: system
        pass_filenames: false
        require_serial: true
        always_run: true
        stages: [manual]

  # ---------------------------------------------------------------- frontend
  # Both require `npm --prefix frontends/wysiwyg-grilling ci` once.
  # They fail loudly rather than skipping, so a missing install can never
  # masquerade as a passing check.
  #
  # LOUDLY IS NOT THE SAME AS CLEARLY, which is what v0.9 whole-branch
  # review M-6 measured and what the guard below closes. This comment and
  # AGENTS.md both promised "a clear message"; what a fresh clone actually
  # got was `sh: 1: eslint: not found` and exit 127 — a sentence about a
  # binary, naming neither the cause nor the one command that fixes it.
  # The guard runs first, on the same file set, so the remedy is the first
  # thing in the output rather than something to infer from the noise.
  # ONE hook and not a line in each of the two below, because a remedy
  # spelled twice is a remedy that drifts.
  - repo: local
    hooks:
      - id: frontend-deps
        name: frontend deps installed?
        entry: >-
          bash -c 'test -d frontends/wysiwyg-grilling/node_modules && exit 0;
          echo "frontend dependencies are not installed, so the eslint and tsc hooks cannot run.";
          echo "Install them once with:";
          echo "    npm --prefix frontends/wysiwyg-grilling ci";
          echo "This is provisioning, not a code defect: the hooks fail rather than skip, so a missing install can never masquerade as a passing check.";
          exit 1'
        language: system
        pass_filenames: false
        require_serial: true
        files: ^frontends/wysiwyg-grilling/(src/.*\.(ts|tsx)|eslint\.config\.js|tsconfig\.json|package\.json)$

      - id: eslint
        name: eslint (frontend)
        entry: npm --prefix frontends/wysiwyg-grilling run --silent lint
        language: system
        pass_filenames: false
        require_serial: true
        files: ^frontends/wysiwyg-grilling/(src/.*\.(ts|tsx)|eslint\.config\.js|package\.json)$

      - id: tsc
        name: tsc --noEmit (frontend)
        entry: npm --prefix frontends/wysiwyg-grilling run --silent typecheck
        language: system
        pass_filenames: false
        require_serial: true
        files: ^frontends/wysiwyg-grilling/(src/.*\.(ts|tsx)|tsconfig\.json|package\.json)$

  # Playwright E2E suite (WP8): starts real canvas.py servers per worker,
  # so it runs on demand, not on every commit:
  #   uvx pre-commit run e2e-tests --hook-stage manual
  #
  # `always_run` added 2026-08-20: the command written one line above was
  # measured printing "(no files to check)Skipped", exit 0, on a tree with
  # nothing staged. A manual hook is one somebody has gone out of their
  # way to ask for, so "no file changed" is never the right answer to give
  # them — it is the whole E2E suite reporting green for not having run.
  - repo: local
    hooks:
      - id: e2e-tests
        name: playwright e2e (manual stage)
        entry: bash -c 'cd frontends/wysiwyg-grilling && npm run test:e2e'
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
