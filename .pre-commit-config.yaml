# Run:      uvx pre-commit run --all-files
# Install:  uvx pre-commit install
# Update:   uvx pre-commit autoupdate
#
# Excluded globally below:
#   scripts/web/    369 tracked files of committed Vite build output
#   tests/fixtures/ byte-exact scene fixtures — whitespace fixes break tests
#   package-lock.json, uv.lock, skills-lock.json — generated

exclude: |
  (?x)^(
    skills/wysiwyg-grilling/scripts/web/.*
    |tests/fixtures/.*
    |frontends/wysiwyg-grilling/package-lock\.json
    |uv\.lock
    |skills-lock\.json
  )$

repos:
  # ---------------------------------------------------------------- hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-ast
      - id: debug-statements

  # ------------------------------------------------- python lint + docstrings
  # Covers E/F/W/I/B/SIM/N + D (Google docstrings) + ANN (type hints)
  # + DOC (Args/Returns completeness). Configured in pyproject.toml.
  # No `ruff format`: see AGENTS.md § Formatting.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]

  # ------------------------------------------------------ python type checking
  # Runs on the real interpreter floor (3.9), not the local default.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (canvas.py)
        entry: uvx mypy@1.18.2
        language: system
        pass_filenames: false
        require_serial: true
        files: ^skills/wysiwyg-grilling/scripts/canvas\.py$
        args: [skills/wysiwyg-grilling/scripts/canvas.py]

  # -------------------------------------------------------------- live values
  # The `<!-- live:NAME -->` values in tracked markdown, recomputed from
  # their sources. Deliberately unscoped by `files:`: a value derives from
  # code, not from the document holding it, so any pattern narrow enough to
  # be worth writing would itself go stale — which is the defect this hook
  # exists for. It costs ~0.5s and reads only what `git ls-files` lists, so
  # the gitignored docs/ tree is out of reach by construction.
  # When it fails: `python3 tests/livedoc.py refresh`.
  - repo: local
    hooks:
      - id: livedoc
        name: livedoc check (live values in tracked prose)
        entry: python3 tests/livedoc.py check
        language: system
        pass_filenames: false
        require_serial: true

  # ------------------------------------------------------------------- tests
  - repo: local
    hooks:
      - id: backend-tests
        name: backend tests
        entry: python3 -m unittest discover -s tests -q
        language: system
        pass_filenames: false
        require_serial: true
        files: ^(skills/wysiwyg-grilling/scripts/canvas\.py|tests/.*\.py)$

  # ---------------------------------------------------------------- frontend
  # Both require `npm --prefix frontends/wysiwyg-grilling ci` once.
  # They fail loudly rather than skipping, so a missing install can never
  # masquerade as a passing check.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: npm --prefix frontends/wysiwyg-grilling run --silent lint
        language: system
        pass_filenames: false
        require_serial: true
        files: ^frontends/wysiwyg-grilling/(src/.*\.(ts|tsx)|eslint\.config\.js|package\.json)$

      - id: tsc
        name: tsc --noEmit (frontend)
        entry: npm --prefix frontends/wysiwyg-grilling run --silent typecheck
        language: system
        pass_filenames: false
        require_serial: true
        files: ^frontends/wysiwyg-grilling/(src/.*\.(ts|tsx)|tsconfig\.json|package\.json)$

  # Playwright E2E suite (WP8): starts real canvas.py servers per worker,
  # so it runs on demand, not on every commit:
  #   uvx pre-commit run e2e-tests --hook-stage manual
  - repo: local
    hooks:
      - id: e2e-tests
        name: playwright e2e (manual stage)
        entry: bash -c 'cd frontends/wysiwyg-grilling && npm run test:e2e'
        language: system
        pass_filenames: false
        stages: [manual]
